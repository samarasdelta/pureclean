    <meta name="description" content="PureClean — Βιολογικοί καθαρισμοί στρωμάτων, σαλονιών, χαλιών & μοκετών, παιδικού εξοπλισμού και καθισμάτων γραφείου σε όλη τη Θεσσαλονίκη και τη Νέα Μηχανιώνα." />

    <title>PureClean | Βιολογικοί Καθαρισμοί Θεσσαλονίκη - Νέα Μηχανιώνα</title>
    <script>
      // Companion decode step for the GitHub Pages SPA redirect in 404.html.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
